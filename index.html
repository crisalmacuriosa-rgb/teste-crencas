<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teste de Crenças 4.4 — Espelhos da Alma</title>

  <!-- Estilos -->
  <link rel="stylesheet" href="style.css" />

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Script principal -->
  <script src="script.js" defer></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>🜂 Teste de Crenças 4.4</h1>
      <p class="subtitle">Espelhos da Alma — um mergulho simbólico nas forças e feridas que moldam quem somos</p>
    </header>

    <main id="quiz-container">
      <!-- As perguntas serão inseridas dinamicamente pelo script.js -->
    </main>

    <section id="result-container" class="hidden">
      <h2>Seu Mapa de Crenças</h2>
      <canvas id="resultChart"></canvas>
      <div id="result-text"></div>
      <button id="restart-btn" class="btn">Refazer o Teste</button>
    </section>

    <footer>
      <p>Versão 4.4 • Desenvolvido com 🌙 por Crisalma Curiosa</p>
    </footer>
  </div>
</body>
</html>
