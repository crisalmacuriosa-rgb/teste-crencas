<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teste de Crenças — Espelhos da Alma 4.4.1</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="script.js" defer></script>
</head>

<body>
  <div class="container">
    <header>
      <h1>🪞 Teste de Crenças — Espelhos da Alma</h1>
      <p class="subtitle">
        Um caminho simbólico de autoconhecimento.  
        Responda com sinceridade — o espelho reflete o que a alma deseja mostrar.
      </p>
    </header>

    <!-- QUIZ -->
    <main id="quiz-container" class="fade-in">
      <h2>Carregando perguntas...</h2>
    </main>

    <!-- RESULTADOS -->
    <section id="result-container" class="hidden fade-in">
      <canvas id="resultChart"></canvas>
      <div id="result-text" class="result-text"></div>
      <button id="restart-btn" class="btn">Refazer o teste</button>
    </section>

    <footer>
      <p>Versão 4.4.1 — © 2025 Espelhos da Alma</p>
    </footer>
  </div>
</body>
</html>
