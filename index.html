<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teste de Crenças 4.3 — O Mapa das Feridas e Arquétipos</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js" defer></script>
  </head>

  <body>
    <div class="container">
      <h1>🜂 Teste de Crenças 4.3</h1>
      <p class="intro">
        Descubra quais feridas e arquétipos moldam suas crenças mais profundas.
        Responda com sinceridade, sentindo cada pergunta como um espelho simbólico.
      </p>

      <div id="quiz"></div>

      <button id="nextButton">Próxima</button>

      <div id="result" class="hidden">
        <h2>🌕 Seu Mapa Simbólico</h2>
        <canvas id="resultChart"></canvas>
        <p id="resultText"></p>
      </div>
    </div>
  </body>
</html>
